name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check tag matches userscript version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's#^// @version *##p' komf.meta.js)
          if [ "$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match @version ${version} in komf.meta.js"
            exit 1
          fi

      - run: npm run userscript

      - uses: actions/upload-artifact@v4
        with:
          name: komf.user.js
          path: komf.user.js

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" komf.user.js --title "${GITHUB_REF_NAME}" --generate-notes
